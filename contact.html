            </div>
        </nav>
    </header>

    <main class="container">
        <section class="contact-container">
            <h1 class="section-title">Initialize_Handshake</h1>

            <div class="terminal-panel">
                <div class="terminal-header">
                    <span>user@visitor:~/contact</span>
                    <span>-- -bash</span>
                </div>

                <form id="contact-form" action="https://api.web3forms.com/submit" method="POST">
                    <!-- Hidden Inputs for Web3Forms -->
                    <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
                    <input type="hidden" name="subject" value="New Submission from Portfolio">
                    <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

                    <div class="form-group">
                        <label for="name" class="form-label">> input --name</label>
                        <input type="text" id="name" name="name" class="form-input" placeholder="Your Name" required>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">> input --email</label>
                        <input type="email" id="email" name="email" class="form-input" placeholder="name@example.com"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="message" class="form-label">> input --message</label>
                        <textarea id="message" name="message" class="form-textarea"
                            placeholder="Type your message here..." required></textarea>
                    </div>

                    <button type="submit" class="btn" style="width: 100%;">Transmit Message</button>

                    <p id="form-status" class="mono" style="margin-top: 16px; font-size: 0.9rem; display: none;"></p>
                </form>
            </div>
        </section>
    </main>
